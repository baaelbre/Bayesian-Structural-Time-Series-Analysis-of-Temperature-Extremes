[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bucex"
dynamic = ["version"]
description = "Bayesian structural time-series models for Gaussian bulk and GEV extremes"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [{name = "Bastiaan AVV"}]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "pandas>=1.5",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering :: Mathematics",
]

[project.optional-dependencies]
plot = ["matplotlib>=3.6"]
test = ["pytest>=7"]
dev = ["build>=1", "pytest>=7", "matplotlib>=3.6"]

[tool.setuptools.dynamic]
version = {attr = "bucex.__about__.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["bucex*"]
exclude = ["bucex.obs", "bucex.obs.*"]

[tool.setuptools.package-data]
bucex = ["data/*.csv", "data/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
